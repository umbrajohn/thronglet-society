[package]
name = "thronglet_core"
version = "1.0.0"
edition = "2021"
authors = ["Throng"]
description = "Thronglet Core - C++/Rust implementation based on Bitcoin Core and Solana Core"
license = "MIT"

[[bin]]
name = "thronglet_node_rust"
path = "main.rs"

[lib]
name = "thronglet_core"
path = "thronglet_core.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "thronglet_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true